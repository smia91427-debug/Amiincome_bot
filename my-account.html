<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - AMI Income</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0c1b;
            color: #ffffff;
            padding-bottom: 80px;
        }
        .header {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #2d2254;
            background: #151125;
        }
        .profile-container {
            padding: 20px;
        }
        .profile-card {
            background: #1f1a3a;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff2a85, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 15px auto;
            color: #fff;
        }
        .info-list {
            background: #1f1a3a;
            border-radius: 15px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            overflow: hidden;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .label {
            color: #aaa;
        }
        .value {
            color: #ffecd2;
            font-weight: bold;
        }
        /* নিচের ন্যাভবার */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #151125;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #2d2254;
        }
        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #aaa;
            font-size: 11px;
        }
        .nav-item.active {
            color: #ff2a85;
        }
        .nav-icon {
            font-size: 18px;
            display: block;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">👤 আমার অ্যাকাউন্ট</div>

    <div class="profile-container">
        <!-- প্রোফাইল কার্ড -->
        <div class="profile-card">
            <div class="avatar-circle" id="user-initial">U</div>
            <h3 id="profile-name" style="margin-bottom: 5px;">User Name</h3>
            <p style="color: #4ade80; font-size: 13px;">● Active Account</p>
        </div>

        <!-- ডিটেইলস লিস্ট -->
        <div class="info-list">
            <div class="info-row">
                <span class="label">ইউজারনেম</span>
                <span class="value" id="profile-username">@username</span>
            </div>
            <div class="info-row">
                <span class="label">টেলিগ্রাম আইডি</span>
                <span class="value" id="profile-id">000000</span>
            </div>
            <div class="info-row">
                <span class="label">বর্তমান ব্যালেন্স</span>
                <span class="value" style="color: #ff2a85;">৳ <span id="profile-balance">0.00</span></span>
            </div>
        </div>
    </div>

    <!-- নিচের মেনুবার (সব পেজে রাখবেন) -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>Home
        </a>
        <a href="tasks.html" class="nav-item">
            <span class="nav-icon">📋</span>Tasks
        </a>
        <a href="ad-earn.html" class="nav-item">
            <span class="nav-icon">📺</span>Ad Earn
        </a>
        <a href="withdraw.html" class="nav-item">
            <span class="nav-icon">💳</span>Withdraw
        </a>
        <a href="my-team.html" class="nav-item">
            <span class="nav-icon">👥</span>My Team
        </a>
        <a href="my-account.html" class="nav-item active">
            <span class="nav-icon">👤</span>Account
        </a>
    </div>

    <!-- টেলিগ্রাম থেকে অটো ডেটা নেওয়ার স্ক্রিপ্ট -->
    <script>
        if (window.Telegram && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
            const user = Telegram.WebApp.initDataUnsafe.user;
            
            // নাম সেট করা
            const fullName = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('profile-name').innerText = fullName;
            
            // গোল বৃত্তে নামের প্রথম অক্ষর দেওয়া
            document.getElementById('user-initial').innerText = user.first_name.charAt(0).toUpperCase();
            
            // ইউজারনেম সেট করা
            document.getElementById('profile-username').innerText = user.username ? "@" + user.username : "N/A";
            
            // আইডি সেট করা
            document.getElementById('profile-id').innerText = user.id;
        }
    </script>
</body>
</html>
